name: GoPlan quality checks

on:
  push:
    branches: [goplan-completion]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker JavaScript syntax
        run: node --check worker/src/index.js
      - name: Check cloud integration JavaScript syntax
        run: node --check goplan-cloud.js
      - name: Check service worker syntax
        run: node --check sw.js
      - name: Check inline app and repository assets
        run: node scripts/check-app.mjs
      - name: Test cloud merge and deletion conflict handling
        run: node scripts/test-cloud-merge.mjs

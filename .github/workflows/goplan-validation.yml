name: GoPlan validation

on:
  push:
    branches:
      - goplan-complete-dev
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm test
      - name: Validate Wrangler TOML configuration
        run: |
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("wrangler.toml").read_text(encoding="utf-8"))
          assert config.get("name") == "goplan-api"
          assert config.get("main") == "src/index.js"
          assert config.get("d1_databases", [{}])[0].get("binding") == "DB"
          assert config.get("triggers", {}).get("crons")
          print("Wrangler TOML parsed and required bindings exist.")
          PY

      - name: Validate D1 migration SQL
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.execute("PRAGMA foreign_keys = ON")
          db.executescript(Path("migrations/0001_initial.sql").read_text(encoding="utf-8"))
          names = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          required = {
              "users", "user_state", "cloud_backups", "conversations", "ai_plans",
              "ai_memories", "ai_settings", "notification_settings", "notification_events",
              "place_watches", "push_subscriptions", "notification_log", "api_rate_limits"
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing D1 tables: " + ", ".join(missing))
          print("D1 migration SQL parsed and required tables exist.")
          PY

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML, IDs and inline JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import collections

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.inline = []
                  self.in_script = False
                  self.current_script = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "script" and "src" not in attrs:
                      self.in_script = True
                      self.current_script = []
              def handle_data(self, data):
                  if self.in_script:
                      self.current_script.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.inline.append("".join(self.current_script))
                      self.in_script = False

          parser = Checker()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          duplicate = [key for key, count in collections.Counter(parser.ids).items() if count > 1]
          if duplicate:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicate))
          Path("/tmp/goplan-inline.js").write_text("\n".join(parser.inline), encoding="utf-8")
          print(f"HTML parsed; {len(parser.ids)} unique IDs; {len(parser.inline)} inline scripts.")
          PY
          node --check /tmp/goplan-inline.js
          node --check sw.js
          python3 - <<'PY'
          import re
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          class RefChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.add(attrs["id"])
                  for key in ("src", "href"):
                      value = attrs.get(key, "")
                      if value:
                          self.refs.append((tag, key, value))

          html = Path("index.html").read_text(encoding="utf-8")
          parser = RefChecker()
          parser.feed(html)
          missing_ids = sorted(set(re.findall(r"\$\(['\\"]([^'\\"]+)['\\"]\)", html)) - parser.ids)
          if missing_ids:
              raise SystemExit("Missing DOM IDs referenced by $(): " + ", ".join(missing_ids))
          missing_files = []
          for tag, key, value in parser.refs:
              parsed = urlsplit(value)
              if parsed.scheme or parsed.netloc or value.startswith(("#", "data:")):
                  continue
              path = parsed.path
              if not path:
                  continue
              candidate = (Path("index.html").parent / path.lstrip("./")).resolve()
              if not candidate.is_file():
                  missing_files.append(f"{tag} {key}={value}")
          if missing_files:
              raise SystemExit("Missing local files: " + ", ".join(missing_files))
          print("Static references and literal DOM ID lookups are valid.")
          PY
      - name: Check manifest and local assets
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          for icon in manifest.get("icons", []):
              if not Path(icon["src"].removeprefix("./")).is_file():
                  raise SystemExit("Missing manifest icon: " + icon["src"])
          print("Manifest JSON and declared icons are valid.")
          PY
